name: HD Remaster - ROM-free tests
on:
  push:
    branches:
      - feat/hd-remaster-presentation-stage1-20261031
    paths:
      - 'scripts/build_hd_pack.py'
      - 'scripts/analyze_hd_attribution.py'
      - 'scripts/analyze_hd_obj_capture.py'
      - 'tests/hd_pack_test.py'
      - 'tests/hd_attribution_analysis_test.py'
      - 'tests/hd_obj_capture_test.py'
      - 'docs/HD_REMASTER_STAGE1.md'
      - '.github/workflows/hd-remaster-tests.yml'
  workflow_dispatch:

jobs:
  hd_remaster_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Fetch game sources
        uses: actions/checkout@v4
      - name: Prepare Pillow for synthetic image tests
        run: python3 -m pip install --user Pillow
      - name: Run private-pack generator tests (no ROM)
        run: python3 -m unittest discover -s tests -p hd_pack_test.py -v
      - name: Run OBJ/BG attribution analyzer tests (synthetic only)
        run: python3 -m unittest discover -s tests -p hd_attribution_analysis_test.py -v
      - name: Test stable graphics identity grouping (synthetic only)
        run: python3 -m unittest discover -s tests -p hd_obj_capture_test.py -v
      - name: Fetch pinned HD engine
        run: |
          git clone --depth 1 https://github.com/BBlueSkyy/gbarecomp.git /tmp/gbarecomp
          git -C /tmp/gbarecomp fetch --depth 1 origin 8a51e28b5e6cdf56b2c3d1c9a5baa9264192937c
          git -C /tmp/gbarecomp checkout 8a51e28b5e6cdf56b2c3d1c9a5baa9264192937c
      - name: Compile and run HD fingerprint policy test
        run: |
          g++ -std=c++17 -I/tmp/gbarecomp/src/runtime \
            /tmp/gbarecomp/tests/mod_runtime/hd_remaster_test.cpp -o /tmp/hdremaster
          /tmp/hdremaster
      - name: Compile and verify native OBJ/BG metadata decoder
        run: |
          g++ -std=c++17 -I/tmp/gbarecomp/src/gba -I/tmp/gbarecomp/src/runtime \
            /tmp/gbarecomp/tests/mod_runtime/hd_obj_attribution_test.cpp -o /tmp/hdobj
          /tmp/hdobj
