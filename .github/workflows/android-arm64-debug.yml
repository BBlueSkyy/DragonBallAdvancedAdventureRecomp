name: Dragon Ball Advanced Adventure - Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
    steps:
      - name: Checkout private game sources
        uses: actions/checkout@v4

      - name: Prepare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android SDK tooling
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git python3
          sdkmanager --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.1.12297006' \
            'cmake;3.22.1'

      # The default GITHUB_TOKEN is scoped to this game repository and
      # cannot automatically read the separate *private* gbarecomp engine.
      # Add a repository Actions secret GBARECOMP_READ_TOKEN with read-only
      # Contents access to BBlueSkyy/gbarecomp (fine-grained PAT / GitHub App).
      - name: Verify private engine access token is configured
        env:
          GBARECOMP_READ_TOKEN: ${{ secrets.GBARECOMP_READ_TOKEN }}
        run: |
          if [ -z "$GBARECOMP_READ_TOKEN" ]; then
            echo "::error::Configure Actions secret GBARECOMP_READ_TOKEN with Contents: Read permission on the private BBlueSkyy/gbarecomp repository."
            exit 1
          fi

      - name: Checkout pinned private GBARecomp engine
        uses: actions/checkout@v4
        with:
          repository: BBlueSkyy/gbarecomp
          ref: bc24482b1232b38e39798098a638121121e838eb
          path: gbarecomp
          token: ${{ secrets.GBARECOMP_READ_TOKEN }}
          persist-credentials: false

      - name: Fetch engine public submodules and pinned recomp-ui
        run: |
          git -C gbarecomp submodule set-url external/arm-recomp-core https://github.com/mstan/arm-recomp-core.git
          git -C gbarecomp submodule update --init --recursive --jobs 4
          git clone https://github.com/mstan/recomp-ui.git recomp-ui
          git -C recomp-ui checkout 3f1d6f1
          git -C recomp-ui submodule update --init --recursive --jobs 4

      - name: Validate code and write ROM-free Android metadata
        run: python3 scripts/generate_ci_metadata.py

      - name: Build ARM64 APK
        working-directory: android
        run: |
          gradle :app:assembleDebug \
            -PgbaAbis=arm64-v8a \
            -PgbaNativeJobs=1 \
            --no-daemon \
            --max-workers=2 \
            --stacktrace

      - name: Inspect generated APK
        run: |
          ls -lah android/app/build/outputs/apk/debug/
          sha256sum android/app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DragonBallAdvancedAdventure-USA-ARM64-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

